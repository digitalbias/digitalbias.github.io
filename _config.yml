# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "David C Mitchell"
title_separator          : "-"
name                     : "David Mitchell"
description              : ""
url                      : http://www.davidcmitchell.com # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
# url                      : http://localhost:4000 # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
# breadcrumbs            : false # true, false (default)
words_per_minute         : 200
future                   : false # Don't show future posts
lazy_load                : true
# theme                    : minimal-mistakes-jekyll
remote_theme             : "mmistakes/minimal-mistakes"
comments:
  provider               : "custom"
  disqus:
    shortname            : "wwwdigitalbiascom"
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  path                   :
repository               : digitalbias/digitalbias.github.io.

# Giscus comments — https://giscus.app
giscus:
  repo        : "digitalbias/digitalbias.github.io"
  repo_id     : "MDEwOlJlcG9zaXRvcnkzOTcyNDExNw=="
  category    : "Announcements"
  category_id : "DIC_kwDOAl4kVc4C99Hr"

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : digitalbias
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : /images/highrise.jpg
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles

# Analytics
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : G-2HXQH8LP0C

# Site Author
author:
  name             : "David Mitchell"
  avatar           : "/images/bio-photo-dave.jpg"
  bio              : "Experienced Technologist, Outdoorsman, Entrepreneur, Lifelong Learner"
  location         : "Lehi, UT"
  email            : david.c.mitchell@gmail.com
  uri              :
  bitbucket        : digitalbias
  clarity          : davidmitchell
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : digitalbias
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : digitalbias
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          : digitalbias
  vine             :
  weibo            :
  xing             :
  youtube          :


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
paginate: 8 # amount of posts to show
paginate_path: /page:num/
timezone: America/Denver


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-redirect-from
  - jekyll-remote-theme
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-redirect-from

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# Archives
categories:
  type: liquid
  path: /categories/
tags:
  type: liquid
  path: /tags/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

head_scripts:
  - /assets/js/ga_opt_out.js
  - /assets/js/hotjar.js
